# opts
set -a terminal-features "tmux-256color:RGB"
set -g prefix C-SPACE
set -g focus-events on
set -g mode-keys vi
set -g base-index 1
set -g renumber-windows on

# style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=red bold"
set -g status-interval 5
set -g status-left "#S"
set -g status-right "#{?client_prefix,#[fg=blue]—,} #[fg=default]%H:%M" # other indicators: ⌐■ᴗ■ •ᴗ•

# scripts
bind r source "~/.config/tmux/tmux.conf"
bind f run "~/.config/scripts/term/tmux-sessionizer.sh"
bind g run "~/.config/scripts/term/open-github.sh"
bind G neww -n "lazygit" lazygit
bind o run "~/.config/scripts/term/open-pdf.sh"
