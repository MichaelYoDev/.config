onboarding = false

# ============================================================================
# THEME
# ============================================================================
[theme]
name = "rose-pine"
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

[ui]
accent = "#9ccfd8"
prompt_new_tab_name = false

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

# ============================================================================
# KEYS
# ============================================================================
[keys]
prefix = "ctrl+space"

# vim motions for pane nav
focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]

# tmux split bindings
split_vertical = "prefix+%"
split_horizontal = "prefix+\""

# conflict with my lazygit binding
new_worktree = "prefix+alt+w"

# workspace nav
next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"

# agent nav
next_agent = "prefix+ctrl+j"
previous_agent = "prefix+ctrl+k"
focus_agent = "prefix+ctrl+1..9"

# ============================================================================
# CUSTOM COMMANDS
# ============================================================================
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/scripts/term/herdr-sessionizer.sh"
width = "65%"
height = "65%"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"
